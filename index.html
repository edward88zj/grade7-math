<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初一数学知识库 · 讲解与题库</title>
<style>
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --brand:#2563eb; --brand-soft:#eff6ff; --line:#e5e7eb;
    --green:#059669; --green-soft:#ecfdf5; --amber:#b45309; --amber-soft:#fffbeb;
    --red:#dc2626; --red-soft:#fef2f2; --purple:#7c3aed; --purple-soft:#f5f3ff;
    --radius:12px; --shadow:0 1px 3px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.75}
  a{color:var(--brand);text-decoration:none}

  /* ---------- 布局 ---------- */
  .layout{display:flex;min-height:100vh}
  aside{width:290px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;display:flex;flex-direction:column}
  main{flex:1;min-width:0;padding:28px 40px 80px}
  #menuBtn{display:none;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
  #backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:45;display:none}
  #backdrop.show{display:block}
  @media (max-width:900px){
    aside{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .25s}
    aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}
    main{padding:20px 18px 60px}
    /* 悬浮目录按钮：滚动到任何位置都能打开侧边栏 */
    #menuBtn{display:inline-flex;position:fixed;top:12px;left:12px;z-index:60;box-shadow:0 2px 10px rgba(15,23,42,.18);font-weight:600}
  }

  /* ---------- 侧边栏 ---------- */
  .side-head{padding:18px 18px 10px;border-bottom:1px solid var(--line)}
  .side-head h1{font-size:19px;letter-spacing:.5px}
  .side-head h1 em{font-style:normal;color:var(--brand)}
  .side-head .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .search-wrap{padding:12px 14px;border-bottom:1px solid var(--line)}
  .search-wrap input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;outline:none;background:var(--bg)}
  .search-wrap input:focus{border-color:var(--brand);background:#fff}
  nav{flex:1;overflow-y:auto;padding:10px 10px 30px}
  .vol{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:2px;margin:14px 10px 6px}
  .chapter-item{border-radius:9px;margin-bottom:2px}
  .chapter-item>a{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:9px;color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}
  .chapter-item>a:hover{background:var(--brand-soft)}
  .chapter-item.active>a{background:var(--brand);color:#fff}
  .chapter-item .no{font-size:12px;opacity:.65;margin-right:8px;font-weight:400}
  .chapter-item .prog{font-size:11px;font-weight:400;opacity:.75}
  .unit-list{display:none;padding:2px 0 6px}
  .chapter-item.expanded .unit-list{display:block}
  .unit-list a{display:block;padding:5px 12px 5px 34px;font-size:13.5px;color:var(--muted);border-radius:7px}
  .unit-list a:hover{color:var(--brand);background:var(--brand-soft)}
  .unit-list a.active{color:var(--brand);font-weight:600;background:var(--brand-soft)}

  /* ---------- 首页 ---------- */
  .home-hero{background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:16px;color:#fff;padding:34px 36px;margin-bottom:24px}
  .home-hero h2{font-size:26px;margin-bottom:8px}
  .home-hero p{opacity:.92;max-width:640px}
  .home-stats{display:flex;gap:14px;margin-top:18px;flex-wrap:wrap}
  .home-stats div{background:rgba(255,255,255,.16);border-radius:10px;padding:8px 18px;font-size:14px}
  .home-stats b{font-size:20px;margin-right:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .vol-title{font-size:16px;font-weight:700;margin:22px 0 10px;color:var(--muted);letter-spacing:1px}
  .ch-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
  .ch-card:hover{transform:translateY(-2px);border-color:var(--brand)}
  .ch-card .no{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:6px;font-size:12px;font-weight:700;padding:1px 8px;margin-bottom:8px}
  .ch-card h3{font-size:16px;margin-bottom:6px}
  .ch-card p{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ch-card .meta{margin-top:10px;font-size:12px;color:var(--muted);display:flex;gap:12px}
  .ch-card .meta b{color:var(--green)}

  /* ---------- 内容区 ---------- */
  .crumb{font-size:13px;color:var(--muted);margin-bottom:14px}
  .unit-head h2{font-size:24px;margin-bottom:6px}
  .unit-head .tags{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .tag{font-size:12px;border-radius:999px;padding:2px 11px;background:var(--brand-soft);color:var(--brand);font-weight:600}
  .tag.warn{background:var(--amber-soft);color:var(--amber)}
  .tag.purple{background:var(--purple-soft);color:var(--purple)}
  section.block{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;margin-bottom:18px;box-shadow:var(--shadow)}
  section.block>h3{font-size:16.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  section.block>h3::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--brand);display:inline-block}
  section.block.example>h3::before{background:var(--purple)}
  section.block.qbank>h3::before{background:var(--green)}
  .kp{margin-bottom:14px}
  .kp:last-child{margin-bottom:0}
  .kp b{color:var(--brand)}
  .kp p{margin:2px 0}
  .kp .f{font-family:ui-monospace,Consolas,monospace;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 14px;margin:6px 0;white-space:pre-wrap}
  ul.formulas{list-style:none}
  ul.formulas li{padding:6px 0 6px 20px;position:relative;border-bottom:1px dashed var(--line)}
  ul.formulas li:last-child{border-bottom:none}
  ul.formulas li::before{content:"◆";position:absolute;left:2px;color:var(--brand);font-size:11px;top:9px}
  ul.formulas b{font-family:ui-monospace,Consolas,monospace;background:var(--brand-soft);padding:0 5px;border-radius:4px;color:var(--brand)}

  .example .ex-q{background:var(--purple-soft);border-radius:9px;padding:12px 16px;margin-bottom:12px;font-weight:600}
  .steps li{margin:8px 0 8px 20px}
  .steps b{color:var(--purple)}
  .ex-note{background:var(--amber-soft);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 14px;font-size:13.5px;margin-top:12px}
  .ex-note b{color:var(--amber)}

  .q-item{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
  .q-head{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;cursor:pointer}
  .q-head:hover{background:var(--bg)}
  .q-no{flex-shrink:0;width:26px;height:26px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .q-text{flex:1}
  .q-text .diff{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:0 7px;margin-right:8px;vertical-align:1px}
  .diff.基础{background:var(--green-soft);color:var(--green)}
  .diff.提高{background:var(--amber-soft);color:var(--amber)}
  .diff.拓展{background:var(--red-soft);color:var(--red)}
  .q-toggle{flex-shrink:0;font-size:12px;color:var(--brand);font-weight:600;margin-top:4px;white-space:nowrap}
  .q-body{display:none;border-top:1px dashed var(--line);background:var(--bg);padding:14px 18px 14px 52px}
  .q-item.open .q-body{display:block}
  .q-body h5{font-size:13px;color:var(--green);margin-bottom:6px}
  .q-body ol{margin-left:18px}
  .q-body li{margin:4px 0}
  .q-tip{margin-top:10px;background:var(--amber-soft);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:8px 13px;font-size:13px}
  .q-tip b{color:var(--amber)}

  /* ---------- 新板块：教材例题 / 易错 / 难点 / 中考 / 月考 ---------- */
  .ex-box{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;background:var(--bg)}
  .ex-box:last-child{margin-bottom:0}
  .ex-src{display:inline-block;font-size:11px;font-weight:700;background:var(--purple);color:#fff;border-radius:5px;padding:1px 9px;margin-bottom:8px}
  section.block.pit>h3::before{background:var(--amber)}
  section.block.hard>h3::before{background:var(--purple)}
  section.block.zhongkao>h3::before{background:var(--red)}
  section.block.yuekao>h3::before{background:#0891b2}
  section.block.extension>h3::before{background:var(--green)}
  .pit-list,.hard-list{list-style:none}
  .pit-list li{padding:7px 4px 7px 26px;position:relative;border-bottom:1px dashed var(--line)}
  .pit-list li:last-child{border-bottom:none}
  .pit-list li::before{content:"⚠";position:absolute;left:0;top:5px;color:var(--amber);font-size:13px}
  .pit-list b{color:var(--amber)}
  .hard-list li{padding:7px 4px 7px 26px;position:relative;border-bottom:1px dashed var(--line)}
  .hard-list li:last-child{border-bottom:none}
  .hard-list li::before{content:"🔥";position:absolute;left:2px;top:6px;font-size:12px}
  .hard-list b{color:var(--purple)}
  .src-badge{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:0 7px;margin-right:8px;vertical-align:1px}
  .src-badge.zk{background:var(--red-soft);color:var(--red)}
  .src-badge.yk{background:#e0f2fe;color:#0369a1}
  .diff.中考{background:var(--red-soft);color:var(--red)}
  .diff.月考{background:#e0f2fe;color:#0369a1}
  .unit-list a{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .unit-list a .uq{font-size:11px;color:#b6bdc9;flex-shrink:0;font-weight:400}

  /* ---------- 搜索结果 ---------- */
  #searchView{display:none}
  #searchView h2{font-size:20px;margin-bottom:14px}
  .s-group{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 8px;letter-spacing:1px}
  .s-item{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
  .s-item:hover{border-color:var(--brand)}
  .s-item .s-type{font-size:11px;font-weight:700;border-radius:5px;padding:0 6px;margin-right:8px}
  .s-type.kp{background:var(--brand-soft);color:var(--brand)}
  .s-type.q{background:var(--green-soft);color:var(--green)}
  .s-item .s-path{font-size:12px;color:var(--muted);margin-top:3px}
  .no-result{color:var(--muted);padding:30px 0;text-align:center}

  footer{margin-top:40px;text-align:center;font-size:12px;color:var(--muted)}

  /* ---------- 考点梳理视图 ---------- */
  #reviewView .r-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
  #reviewView h2.r-title{font-size:24px;margin-bottom:4px}
  #reviewView .r-sub{color:var(--muted);font-size:14px;margin-bottom:16px}
  #reviewView .legend{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  #reviewView .legend span{font-size:13px;border-radius:999px;padding:4px 14px;font-weight:600}
  #reviewView .legend .k{background:var(--brand-soft);color:var(--brand)}
  #reviewView .legend .d{background:var(--purple-soft);color:var(--purple)}
  #reviewView .legend .p{background:var(--amber-soft);color:var(--amber)}
  #reviewView .r-ch{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden;box-shadow:var(--shadow)}
  #reviewView .r-ch-head{display:flex;align-items:center;gap:12px;padding:13px 20px;background:linear-gradient(90deg,var(--brand-soft),transparent);cursor:pointer;user-select:none}
  #reviewView .r-ch-head .no{background:var(--brand);color:#fff;border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
  #reviewView .r-ch-head h3{font-size:17px;flex:1}
  #reviewView .r-ch-head .arr{color:var(--muted);font-size:13px}
  #reviewView .r-ch.closed .r-ch-head .arr::after{content:"▸"}
  #reviewView .r-ch:not(.closed) .r-ch-head .arr::after{content:"▾"}
  #reviewView .r-ch-body{padding:2px 20px 16px}
  #reviewView .r-ch.closed .r-ch-body{display:none}
  #reviewView .sec{margin-top:12px}
  #reviewView .sec h4{font-size:14px;margin-bottom:7px}
  #reviewView .sec.key{background:var(--brand-soft);border-radius:10px;padding:11px 15px}
  #reviewView .sec.key h4{color:var(--brand)}
  #reviewView .sec.diff{background:var(--purple-soft);border-radius:10px;padding:11px 15px}
  #reviewView .sec.diff h4{color:var(--purple)}
  #reviewView .sec.pit{background:var(--amber-soft);border-left:3px solid var(--amber);border-radius:0 10px 10px 0;padding:11px 15px}
  #reviewView .sec.pit h4{color:var(--amber)}
  #reviewView .sec ul{list-style:none}
  #reviewView .sec li{padding:3px 0 3px 20px;position:relative}
  #reviewView .sec.key li::before{content:"";position:absolute;left:4px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--brand)}
  #reviewView .sec.diff li::before{content:"";position:absolute;left:4px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--purple)}
  #reviewView .sec.pit li::before{content:"✗";position:absolute;left:0;top:3px;font-size:12px;color:var(--amber);font-weight:700}
  #reviewView .sec b{color:var(--brand)}
  #reviewView .sec.diff b{color:var(--purple)}
  #reviewView .sec.pit b{color:var(--amber)}

  /* ---------- 思维导图视图 ---------- */
  #mindmapView{position:relative}
  #mmBar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px;box-shadow:var(--shadow);margin-bottom:10px;position:sticky;top:0;z-index:5}
  #mmBar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:13px;cursor:pointer;color:var(--ink)}
  #mmBar button:hover{border-color:var(--brand);color:var(--brand)}
  #mmStage{position:relative;height:calc(100vh - 210px);min-height:480px;background:#f0f4fa;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:grab;touch-action:none}
  #mmStage.dragging{cursor:grabbing}
  #mmStage svg{display:block}
  .mm-node rect{fill:#fff;stroke:var(--line);stroke-width:1;transition:filter .15s}
  .mm-node:hover rect{filter:drop-shadow(0 3px 6px rgba(15,23,42,.25))}
  .mm-node text{fill:var(--ink);font-size:13px;user-select:none;pointer-events:none}
  .mm-node.mm-root rect{fill:#1e3a8a;stroke:#1e3a8a}
  .mm-node.mm-root text{fill:#fff;font-size:17px;font-weight:700}
  .mm-node.mm-ch rect{stroke-width:1.5}
  .mm-node.mm-ch text{font-size:15px;font-weight:700}
  .mm-node.mm-branch rect{fill:#f8fafc}
  .mm-node.mm-branch text{font-weight:600;font-size:13px}
  .mm-link{fill:none;stroke-opacity:.55;stroke-width:1.6}
  .mm-node .tog{font-size:11px;fill:#94a3b8;pointer-events:none}
  #mmHint{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div id="backdrop" onclick="toggleSide()"></div>
<div class="layout">
  <aside id="sidebar">
    <div class="side-head">
      <h1>初一数学<em>知识库</em></h1>
      <div class="sub">人教版 · 教材例题 · 易错难点 · 中考月考题库</div>
    </div>
    <style>
      .side-links{display:flex;gap:8px;padding:10px 12px 0;flex-wrap:wrap}
      .side-links a{font-size:12.5px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--brand);background:var(--brand-soft);font-weight:600;cursor:pointer}
      .side-links a.on{background:var(--brand);color:#fff;border-color:var(--brand)}
      .side-links a:hover{border-color:var(--brand)}
    </style>
    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="🔍 搜索知识点 / 题目，如：绝对值、一元一次方程…">
    </div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <button id="menuBtn" onclick="toggleSide()">☰ 目录</button>
    <div id="homeView"></div>
    <div id="unitView" style="display:none"></div>
    <div id="searchView"></div>
    <div id="reviewView" style="display:none"></div>
    <div id="mindmapView" style="display:none">
      <div id="mmBar">
        <button onclick="mmZoomBy(1.2)">＋ 放大</button>
        <button onclick="mmZoomBy(1/1.2)">－ 缩小</button>
        <button onclick="mmFit()">⛶ 适应窗口</button>
        <button onclick="mmSetAll(false)">展开全部</button>
        <button onclick="mmSetAll(true)">收起全部</button>
      </div>
      <div id="mmStage"></div>
      <div id="mmHint">点击章节 / 分支节点可折叠 · 拖动平移 · 滚轮或按钮缩放</div>
    </div>
    <footer>人教版七年级数学 · 知识库 & 题库（本地网页，可离线使用）</footer>
  </main>
</div>

<script src="data/ch01.js"></script>
<script src="data/ch02.js"></script>
<script src="data/ch03.js"></script>
<script src="data/ch04.js"></script>
<script src="data/ch05.js"></script>
<script src="data/ch06.js"></script>
<script src="data/ch07.js"></script>
<script src="data/ch08.js"></script>
<script src="data/ch09.js"></script>
<script src="data/ch10.js"></script>
<script src="data/ch11.js"></script>
<script src="data/ch12.js"></script>
<script src="data/review-u.js"></script>
<script>
(function(){
  var CHAPTERS = window.CHAPTERS || [];
  var nav = document.getElementById('nav');
  var homeView = document.getElementById('homeView');
  var unitView = document.getElementById('unitView');
  var searchView = document.getElementById('searchView');
  var reviewView = document.getElementById('reviewView');
  var mindmapView = document.getElementById('mindmapView');
  var searchInput = document.getElementById('searchInput');

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  // 题干允许 *x* 表示强调（渲染为 <b>），避免裸 HTML
  function fmt(s){return esc(s).replace(/\*([^*]+)\*/g,'<b>$1</b>');}
  function doneKey(qid){return 'zd_math_done:'+qid;}
  function isDone(qid){try{return localStorage.getItem(doneKey(qid))==='1';}catch(e){return false;}}
  function setDone(qid,v){try{v?localStorage.setItem(doneKey(qid),'1'):localStorage.removeItem(doneKey(qid));}catch(e){}}

  // 四大题库分区：key -> 标题
  var BANKS=[["questions","分层题库"],["zhongkao","中考真题"],["yuekao","月考 · 期中期末"],["extension","拓展提升"]];
  function allQuestions(){
    var arr=[];CHAPTERS.forEach(function(c){(c.units||[]).forEach(function(u){
      BANKS.forEach(function(b){(u[b[0]]||[]).forEach(function(q,i){arr.push({ch:c,u:u,q:q,i:i,bank:b[0]});});});
    });});return arr;
  }
  function qid(ch,u,bank,i){return ch.id+'/'+u.id+'/'+bank+'/'+i;}

  /* ---------- 侧边栏 ---------- */
  function buildNav(){
    var html='',cur=route();
    var v=cur.view||'';
    html+='<div class="side-links">'+
      '<a data-nav="review" class="'+(v==='review'?'on':'')+'">📋 上册考点梳理</a>'+
      '<a data-nav="mindmap" class="'+(v==='mindmap'?'on':'')+'">🧠 上册思维导图</a></div>';
    ['上册','下册'].forEach(function(vol){
      html+='<div class="vol">'+vol+'</div>';
      CHAPTERS.filter(function(c){return c.volume===vol;}).forEach(function(c){
        var total=0,cnt=0;
        (c.units||[]).forEach(function(u){BANKS.forEach(function(b){(u[b[0]]||[]).forEach(function(q,i){total++;if(isDone(qid(c,u,b[0],i)))cnt++;});});});
        var activeCh = cur.ch===c.id;
        html+='<div class="chapter-item'+(activeCh?' active expanded':'')+'" data-ch="'+c.id+'">'+
          '<a data-nav="ch:'+c.id+'"><span><span class="no">'+c.no+'</span>'+esc(c.title)+'</span>'+

  /* ---------- 搜索 ---------- */
  var searchTimer=null;

  function doSearch(kw){
    if(!kw){show('home');return;}
    var hits=[];
    CHAPTERS.forEach(function(c){
      (c.units||[]).forEach(function(u){
        if((u.title+' '+(u.summary||'')).indexOf(kw)>-1||(u.exam||'').indexOf(kw)>-1)
          hits.push({type:'kp',ch:c,u:u,text:esc(u.title)+' — '+esc((u.summary||'').slice(0,60))});
        (u.points||[]).forEach(function(p){
          if((p.t+' '+(p.d||'')).indexOf(kw)>-1)
            hits.push({type:'kp',ch:c,u:u,text:'<b>'+esc(p.t)+'</b>：'+esc((p.d||'').replace(/\*[^*]*\*/g,'').slice(0,70))});
        });
        BANKS.forEach(function(bk){
          (u[bk[0]]||[]).forEach(function(q,i){
            if(q.q.indexOf(kw)>-1||(q.tip||'').indexOf(kw)>-1)
              hits.push({type:'q',bank:bk[0],tag:bk[1],ch:c,u:u,qi:i,text:esc(q.q.replace(/\*[^*]*\*/g,'').slice(0,80)),diff:q.diff});
          });
        });
        (u.pitfalls||[]).forEach(function(x){
          if(x.indexOf(kw)>-1)hits.push({type:'kp',ch:c,u:u,text:'<span class="s-type" style="background:var(--amber-soft);color:var(--amber)">易错点</span>'+esc(x.replace(/\*[^*]*\*/g,'').slice(0,70))});
        });
        (u.hardPoints||[]).forEach(function(x){
          if(x.indexOf(kw)>-1)hits.push({type:'kp',ch:c,u:u,text:'<span class="s-type" style="background:var(--purple-soft);color:var(--purple)">难点</span>'+esc(x.replace(/\*[^*]*\*/g,'').slice(0,70))});
        });
      });
    });
    show('search');
    var html='<h2>搜索“'+esc(kw)+'” — 共 '+hits.length+' 条结果</h2>';
    if(!hits.length){html+='<div class="no-result">未找到相关内容，换个关键词试试（如：绝对值、数轴、方程、平行线）</div>';}
    else{
      html+=hits.slice(0,60).map(function(h){
        var nav='u:'+h.ch.id+'/'+h.u.id+(h.type==='q'?'?bank='+h.bank+'&q='+h.qi:'');
        var label=h.type==='kp'?'知识点':((h.tag||'')+(h.diff?'·':'')+(h.diff||'')||'题');
        return '<a class="s-item" data-nav="'+nav+'">'+
          '<span class="s-type '+h.type+'">'+label+'</span>'+h.text+
          '<div class="s-path">'+esc(h.ch.title)+' · '+esc(h.u.title)+'</div></a>';
      }).join('');
      if(hits.length>60)html+='<div class="no-result">仅显示前 60 条，请缩小关键词范围</div>';
    }
    searchView.innerHTML=html;
  }

  /* ---------- 路由 ---------- */
  function route(){
    var h=decodeURIComponent(location.hash.replace(/^#/,''));
    if(h==='review'||h==='mindmap')return {view:h,ch:'',uId:'',qi:-1};
    var isUnit=h.indexOf('u:')===0;
    if(isUnit)h=h.slice(2);
    else if(h.indexOf('ch:')===0)h=h.slice(3);
    var parts=h.split('?');
    var mb=(parts[1]||'').match(/bank=([a-z]+)&q=(\d+)/)||[];
    var seg=(parts[0]||'').split('/');
    return {view:'',ch:seg[0]||'',uId:seg[1]||'',bank:mb[1]||'questions',qi:mb[2]?parseInt(mb[2],10):-1};
  }
  function go(hash){location.hash=hash;}
  window.toggleSide=function(){
    var sb=document.getElementById('sidebar');
    var open=sb.classList.toggle('open');
    document.getElementById('backdrop').classList.toggle('show',open);
  };
  function show(view){
    homeView.style.display=view==='home'?'block':'none';
    unitView.style.display=view==='unit'?'block':'none';
    searchView.style.display=view==='search'?'block':'none';
    reviewView.style.display=view==='review'?'block':'none';
    mindmapView.style.display=view==='mindmap'?'block':'none';
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('backdrop').classList.remove('show');
  }
  function render(){
    var r=route();
    if(r.view==='review'){buildNav();show('review');buildReview();return;}
    if(r.view==='mindmap'){buildNav();show('mindmap');mmInit();return;}
    // 只给了章节（点章节卡片）→ 打开该章第一节
    if(r.ch&&!r.uId){
      var c=CHAPTERS.filter(function(x){return x.id===r.ch;})[0];
      if(c&&c.units&&c.units.length){location.replace('#u:'+c.id+'/'+c.units[0].id);return;}
    }
    buildNav();
    if(r.ch&&r.uId){show('unit');buildUnit(r.ch,r.uId,r.qi,r.bank);}
    else{show('home');buildHome();}
  }
  window.addEventListener('hashchange',render);

  /* ---------- 事件委托 ---------- */
  document.addEventListener('click',function(e){
    var navEl=e.target.closest('[data-nav]');
    if(navEl){
      e.preventDefault();
      var v=navEl.getAttribute('data-nav');
      go(v||'');
      return;
    }
    var rchEl=e.target.closest('.r-ch-head');
    if(rchEl){
      rchEl.parentElement.classList.toggle('closed');
      return;
    }
    var qEl=e.target.closest('.q-item');
    if(qEl&&e.target.closest('.q-head')){
      qEl.classList.toggle('open');
      setDone(qEl.getAttribute('data-q'),qEl.classList.contains('open'));
      var r=route();buildNav();
      // 保留当前内容，不重渲染正文
      if(r.ch&&r.uId)show('unit');else{show('home');buildHome();}
    }
  });

  /* ---------- 思维导图视图 ---------- */
  var mmState=null;
  function mmBuildTree(){
    var COLORS=['#2563eb','#0891b2','#059669','#d97706','#dc2626','#7c3aed'];
    var root={t:'初一上册\n数学',level:0,children:[]};
    (window.REVIEW_UPPER||[]).forEach(function(c,i){
      var ch={t:'第'+c.no+'章 '+c.title,level:1,color:COLORS[i%COLORS.length],children:[]};
      (c.branches||[]).forEach(function(b){
        ch.children.push({t:b.t,level:2,color:ch.color,children:(b.leaves||[]).map(function(l){return{t:l,level:3,children:[]};})});
      });
      root.children.push(ch);
    });
    return root;
  }
  function mmKey(n){if(!n.__k){n.__k='k'+(++mmState.seq);mmState.map[n.__k]=n;}return n.__k;}
  function mmFind(k){return mmState.map[k];}
  function mmTextW(t,fs){var lines=String(t).split('\n');var m=0;lines.forEach(function(l){var w=0;for(var i=0;i<l.length;i++)w+=(l.charCodeAt(i)>255?fs:fs*0.55);m=Math.max(m,w);});return m;}
  function mmEstW(n){var fs=n.level===0?17:n.level===1?15:13;return mmTextW(n.t,fs)+36+(n.level<=1?14:0);}
  function mmShade(hex,p){
    var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    r=Math.round(r+(255-r)*(1-p));g=Math.round(g+(255-g)*(1-p));b=Math.round(b+(255-b)*(1-p));
    return '#'+[r,g,b].map(function(v){return ('0'+v.toString(16)).slice(-2);}).join('');
  }
  function mmLayout(){
    var root=mmState.root;
    (function clear(n){n.x=undefined;n.y=undefined;n.children&&n.children.forEach(clear);})(root);
    (function size(n){
      if(!n.children||!n.children.length||n.collapsed){n.h=n.level===0?70:n.level===1?46:34;n.tw=mmEstW(n);return;}
      var sum=0;n.children.forEach(function(c){size(c);sum+=c.h;});
      sum+=8*(n.children.length-1);n.h=Math.max(n.level===0?70:n.level===1?46:34,sum);n.kidsH=sum;
    })(root);
    (function place(n,yTop,x){
      n.x=x;n.y=yTop+n.h/2;
      if(!n.children||!n.children.length||n.collapsed)return;
      var cy=yTop+((n.h-(n.kidsH||0))/2);
      n.children.forEach(function(c){place(c,cy,x+n.tw+46);cy+=c.h+8;});
    })(root,0,0);
    var right=0,bot=0;
    (function walk(n){right=Math.max(right,(n.x||0)+(n.tw||0));bot=Math.max(bot,(n.y||0)+(n.h/2||0));(n.children||[]).forEach(walk);})(root);
    return {w:right+40,h:bot+40};
  }
  function mmDraw(){
    var size=mmLayout();
    var svgNS='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(svgNS,'svg');
    svg.setAttribute('width',Math.max(size.w,800));
    svg.setAttribute('height',Math.max(size.h,600));
    var links='',nodes='';
    (function walk(n){
      (n.children||[]).forEach(function(c){
        if(c.x===undefined)return;
        var x1=(n.x||0)+(n.tw||0),y1=n.y,x2=c.x,y2=c.y;
        var mx=(x1+x2)/2;
        links+='<path class="mm-link" d="M'+x1+' '+y1+' C'+mx+' '+y1+','+mx+' '+y2+','+x2+' '+y2+'" stroke="'+(n.level===0?'#1e3a8a':(n.color||'#94a3b8'))+'"/>';
        walk(c);
      });
      if(n.x===undefined)return;
      var fs=n.level===0?17:n.level===1?15:13;
      var lines=String(n.t).split('\n');
      var w=n.tw||100,h=n.h;
      var cls=n.level===0?'mm-root':n.level===1?'mm-ch':'mm-branch';
      var hasKids=n.children&&n.children.length;
      var rectFill='';
      if(n.level===2)rectFill=' fill="'+mmShade(n.color,.88)+'" stroke="'+n.color+'"';
      nodes+='<g class="mm-node '+cls+(hasKids?' haskids':'')+'" data-k="'+mmKey(n)+'" transform="translate('+n.x+','+(n.y-h/2)+')">'+
        '<rect width="'+w+'" height="'+h+'" rx="'+(n.level<=1?12:9)+'"'+rectFill+'/>';
      lines.forEach(function(l,i){
        nodes+='<text x="'+(hasKids?12:w/2)+'" y="'+(h/2+(i-(lines.length-1)/2)*1.25*fs+fs*0.35)+'"'+(hasKids?'':' text-anchor="middle"')+'>'+esc(l)+'</text>';
      });
      if(hasKids)nodes+='<text class="tog" x="'+(w-16)+'" y="'+(h/2+4)+'">'+(n.collapsed?'▸':'▾')+'</text>';
      nodes+='</g>';
    })(mmState.root);
    svg.innerHTML=links+nodes;
    svg.addEventListener('click',function(e){
      var g=e.target.closest('.mm-node.haskids');
      if(!g)return;
      var n=mmFind(g.getAttribute('data-k'));
      if(n){n.collapsed=!n.collapsed;mmDraw();}
    });
    var stage=document.getElementById('mmStage');
    stage.innerHTML='';
    var inner=document.createElement('div');
    inner.style.cssText='position:absolute;left:0;top:0;transform-origin:0 0;width:'+svg.getAttribute('width')+'px;height:'+svg.getAttribute('height')+'px';
    inner.appendChild(svg);
    stage.appendChild(inner);
    mmState.inner=inner;
    mmApply();
  }
  function mmStageSize(){
    var st=document.getElementById('mmStage');
    return {w:st.clientWidth||window.innerWidth||1200,h:st.clientHeight||window.innerHeight||800};
  }
  function mmApply(){
    if(mmState.inner)mmState.inner.style.transform='translate('+mmState.tx+'px,'+mmState.ty+'px) scale('+mmState.scale+')';
  }
  window.mmZoomBy=function(f){
    var s=mmStageSize();
    var cx=s.w/2,cy=s.h/2;
    mmState.tx=cx-(cx-mmState.tx)*f;mmState.ty=cy-(cy-mmState.ty)*f;mmState.scale*=f;mmApply();
  };
  window.mmFit=function(){
    if(!mmState.inner)return;
    var s=mmStageSize();
    var W=parseFloat(mmState.inner.style.width),H=parseFloat(mmState.inner.style.height);
    mmState.scale=Math.min(s.w/W,s.h/H,1.1)*0.96;
    if(!isFinite(mmState.scale)||mmState.scale<=0)mmState.scale=1;
    mmState.tx=(s.w-W*mmState.scale)/2;mmState.ty=(s.h-H*mmState.scale)/2;
    mmApply();
  };
  window.mmSetAll=function(collapsed){
    (function walk(n){if(n.children&&n.children.length&&n.level>0)n.collapsed=collapsed;n.children&&n.children.forEach(walk);})(mmState.root);
    mmDraw();
    if(!collapsed)mmFit();
  };
  function mmInit(){
    if(!mmState)mmState={root:mmBuildTree(),map:{},seq:0,scale:1,tx:0,ty:0,inner:null};
    var stage=document.getElementById('mmStage');
    if(!stage.dataset.bound){
      stage.dataset.bound='1';
      var drag=null;
      stage.addEventListener('mousedown',function(e){drag={x:e.clientX,y:e.clientY,tx:mmState.tx,ty:mmState.ty};stage.classList.add('dragging');});
      window.addEventListener('mousemove',function(e){if(!drag)return;mmState.tx=drag.tx+e.clientX-drag.x;mmState.ty=drag.ty+e.clientY-drag.ty;mmApply();});
      window.addEventListener('mouseup',function(){drag=null;stage.classList.remove('dragging');});
      stage.addEventListener('wheel',function(e){e.preventDefault();mmZoomBy(e.deltaY<0?1.12:1/1.12);},{passive:false});
    }
    mmDraw();
    setTimeout(mmFit,50);
  }

  render();
})();
</script>
</body>
</html>
