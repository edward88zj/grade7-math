<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初一上册数学 · 思维导图</title>
<style>
  :root{--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#2563eb}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f4fa;color:var(--ink);overflow:hidden}
  #bar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:8px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:6px 10px;box-shadow:0 2px 10px rgba(15,23,42,.12);flex-wrap:wrap;justify-content:center}
  #bar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:13px;cursor:pointer;color:var(--ink)}
  #bar button:hover{border-color:var(--brand);color:var(--brand)}
  #bar .title{font-size:13px;font-weight:700;color:var(--brand);padding:0 8px;align-self:center}
  #stage{position:fixed;inset:0;cursor:grab}
  #stage.dragging{cursor:grabbing}
  svg{display:block}
  .node rect{fill:#fff;stroke:var(--line);stroke-width:1;transition:filter .15s}
  .node:hover rect{filter:drop-shadow(0 3px 6px rgba(15,23,42,.25))}
  .node text{fill:var(--ink);font-size:13px;user-select:none;pointer-events:none}
  .node.root rect{fill:#1e3a8a;stroke:#1e3a8a}
  .node.root text{fill:#fff;font-size:17px;font-weight:700}
  .node.ch rect{stroke-width:1.5}
  .node.ch text{font-size:15px;font-weight:700}
  .node.branch rect{fill:#f8fafc}
  .node.branch text{font-weight:600;font-size:13px}
  .link{fill:none;stroke-opacity:.55;stroke-width:1.6}
  .node .tog{font-size:11px;fill:#94a3b8;pointer-events:none}
  #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:999px;padding:4px 16px;border:1px solid var(--line)}
  a.home{position:fixed;top:18px;left:18px;z-index:10;font-size:14px;color:var(--brand);text-decoration:none;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:6px 16px;box-shadow:0 2px 8px rgba(15,23,42,.1)}
</style>
</head>
<body>
<a class="home" href="index.html">← 知识库</a>
<div id="bar">
  <button onclick="zoomBy(1.2)">＋ 放大</button>
  <button onclick="zoomBy(1/1.2)">－ 缩小</button>
  <button onclick="fit()">⛶ 适应窗口</button>
  <button onclick="setAll(false)">展开全部</button>
  <button onclick="setAll(true)">收起全部</button>
  <a class="title" href="review.html" style="text-decoration:none">📋 考点梳理</a>
</div>
<div id="stage"></div>
<div id="hint">点击章节 / 分支节点可折叠 · 拖动平移 · 按钮缩放</div>
<script src="data/review-u.js"></script>
<script>
(function(){
  var COLORS=['#2563eb','#0891b2','#059669','#d97706','#dc2626','#7c3aed'];
  var raw=window.REVIEW_UPPER||[];
  var root={t:'初一上册\n数学',level:0,children:[]};
  raw.forEach(function(c,i){
    var ch={t:'第'+c.no+'章 '+c.title,level:1,color:COLORS[i%COLORS.length],children:[]};
    (c.branches||[]).forEach(function(b){
      ch.children.push({t:b.t,level:2,color:ch.color,children:(b.leaves||[]).map(function(l){return{t:l,level:3,children:[]};})});
    });
    root.children.push(ch);
  });

  var PADX=18,LEAF_H=34,NODE_GAP=12,SUB_GAP=8;
  function textW(t,fs){var lines=String(t).split('\n');var m=0;lines.forEach(function(l){var w=0;for(var i=0;i<l.length;i++)w+=(l.charCodeAt(i)>255?fs:fs*0.55);m=Math.max(m,w);});return m;}
  function nodeH(n){return n.h||((n.children&&n.children.length&&!n.collapsed)?0:34);}
  function estW(n){var fs=n.level===0?17:n.level===1?15:13;return textW(n.t,fs)+PADX*2+(n.level<=1?14:0);}

  function layout(){
    (function size(n){
      if(!n.children||!n.children.length||n.collapsed){n.h=n.level===0?70:n.level===1?46:34;n.tw=estW(n);return;}
      var sum=0,kids=[];
      n.children.forEach(function(c){size(c);kids.push(c);});
      sum=kids.reduce(function(s,c){return s+c.h;},0)+SUB_GAP*(kids.length-1);
      n.h=Math.max(n.level===0?70:n.level===1?46:34,sum);
      n.tw=estW(n);
      n.kidsH=sum;
    })(root);
    (function clear(n){n.x=undefined;n.y=undefined;n.children&&n.children.forEach(clear);})(root);
    (function place(n,yTop,x){
      n.x=x;n.y=yTop+n.h/2;
      if(!n.children||!n.children.length||n.collapsed)return;
      var w=n.tw+46, cy=yTop+((n.h-(n.kidsH||0))/2);
      n.children.forEach(function(c){place(c,cy,x+w);cy+=c.h+SUB_GAP;});
    })(root,0,0);
    var maxX=0;maxX=root;var right=0,bot=0;
    (function walk(n){right=Math.max(right,(n.x||0)+(n.tw||0));bot=Math.max(bot,(n.y||0)+(n.h/2||0));(n.children||[]).forEach(walk);})(root);
    return {w:right+40,h:bot+40};
  }

  function draw(){
    var size=layout();
    var svgNS='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(svgNS,'svg');
    svg.setAttribute('width',Math.max(size.w,800));
    svg.setAttribute('height',Math.max(size.h,600));
    var links='',nodes='';
    (function walk(n){
      (n.children||[]).forEach(function(c){
        if(c.x===undefined)return;
        var x1=(n.x||0)+(n.tw||0),y1=n.y,x2=c.x,y2=c.y;
        var mx=(x1+x2)/2;
        links+='<path class="link" d="M'+x1+' '+y1+' C'+mx+' '+y1+','+mx+' '+y2+','+x2+' '+y2+'" stroke="'+(n.level===0?'#1e3a8a':(n.color||'#94a3b8'))+'"/>';
        walk(c);
      });
      if(n.x===undefined)return;
      var fs=n.level===0?17:n.level===1?15:13;
      var lines=String(n.t).split('\n');
      var w=n.tw||100,h=n.h;
      var cls=n.level===0?'root':n.level===1?'ch':'branch';
      var hasKids=n.children&&n.children.length;
      var rectFill='';
      if(n.level===2)rectFill=' fill="'+shade(n.color,.88)+'" stroke="'+n.color+'"';
      else if(n.level===3)rectFill='';
      nodes+='<g class="node '+cls+(hasKids?' haskids':'')+'" data-k="'+key(n)+'" transform="translate('+n.x+','+(n.y-h/2)+')">'+
        '<rect width="'+w+'" height="'+h+'" rx="'+(n.level<=1?12:9)+'"'+rectFill+'/>';
      lines.forEach(function(l,i){
        nodes+='<text x="'+(hasKids?12:w/2)+'" y="'+(h/2+(i-(lines.length-1)/2)*1.25*fs+fs*0.35)+'"'+(hasKids?'':' text-anchor="middle"')+'>'+esc(l)+'</text>';
      });
      if(hasKids){
        var ex=n.collapsed?'▸':'▾';
        nodes+='<text class="tog" x="'+(w-16)+'" y="'+(h/2+4)+'">'+ex+'</text>';
      }
      nodes+='</g>';
    })(root);
    svg.innerHTML=links+nodes;
    svg.addEventListener('click',function(e){
      var g=e.target.closest('.node.haskids');
      if(!g)return;
      var n=find(g.getAttribute('data-k'));
      if(n){n.collapsed=!n.collapsed;draw();}
    });
    var stage=document.getElementById('stage');
    stage.innerHTML='';
    var inner=document.createElement('div');
    inner.style.cssText='position:absolute;left:0;top:0;transform-origin:0 0;width:'+svg.getAttribute('width')+'px;height:'+svg.getAttribute('height')+'px';
    inner.appendChild(svg);
    stage.appendChild(inner);
    innerEl=inner;
    applyView();
  }
  function shade(hex,p){
    var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    r=Math.round(r+(255-r)*(1-p));g=Math.round(g+(255-g)*(1-p));b=Math.round(b+(255-b)*(1-p));
    return '#'+[r,g,b].map(function(v){return ('0'+v.toString(16)).slice(-2);}).join('');
  }
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var keyMap={},keyN=0;
  function key(n){if(!n.__k){n.__k='k'+(keyN++);keyMap[n.__k]=n;}return n.__k;}
  function find(k){return keyMap[k];}

  // 视图：平移缩放
  var scale=0.9,tx=20,ty=20,innerEl=null;
  function applyView(){
    if(innerEl)innerEl.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
  }
  function stageSize(){
    var st=document.getElementById('stage');
    return {w:st.clientWidth||window.innerWidth||1200,h:st.clientHeight||window.innerHeight||800};
  }
  window.zoomBy=function(f){
    var s=stageSize();
    var cx=s.w/2,cy=s.h/2;
    tx=cx-(cx-tx)*f;ty=cy-(cy-ty)*f;scale*=f;applyView();
  };
  window.fit=function(){
    if(!innerEl)return;
    var s=stageSize();
    var W=parseFloat(innerEl.style.width),H=parseFloat(innerEl.style.height);
    scale=Math.min(s.w/W,s.h/H,1.1)*0.96;
    if(!isFinite(scale)||scale<=0)scale=1;
    tx=(s.w-W*scale)/2;ty=(s.h-H*scale)/2;
    applyView();
  };
  window.setAll=function(collapsed){
    (function walk(n){if(n.children&&n.children.length&&n.level>0)n.collapsed=collapsed;n.children&&n.children.forEach(walk);})(root);
    draw();
    if(!collapsed)fit();
  };
  // 拖拽
  var stage=document.getElementById('stage');
  var drag=null;
  stage.addEventListener('mousedown',function(e){drag={x:e.clientX,y:e.clientY,tx:tx,ty:ty};stage.classList.add('dragging');});
  window.addEventListener('mousemove',function(e){if(!drag)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;applyView();});
  window.addEventListener('mouseup',function(){drag=null;stage.classList.remove('dragging');});
  stage.addEventListener('wheel',function(e){e.preventDefault();zoomBy(e.deltaY<0?1.12:1/1.12);},{passive:false});
  window.addEventListener('resize',function(){});

  draw();
  setTimeout(fit,50);
})();
</script>
</body>
</html>
